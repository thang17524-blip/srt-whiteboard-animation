name: Kiểm thử Windows
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-tested-windows.txt
      - run: python scripts/kiem_tra_moi_truong.py
      - run: python -B -m unittest discover -s tests -v
